services:
  mysql:
    image: mysql:8.0
    # Host port 3307 matches DB_PORT in .env.example and scripts/mysql-local.ps1.
    # The server inside the container still listens on 3306.
    ports: ["3307:3306"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: work_tracker
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 10
volumes:
  mysql-data: