# Content-Security-Policy for the Task-Chan SPA.
# Paste into the Forge site server block that serves frontend/dist (see DEPLOY.md).
# The SPA and the API share one host, so connect-src 'self' is the API origin
# (/api and /sanctum). Fonts and stylesheets are self-hosted. style-src-attr
# allows the style attributes React sets; style-src itself stays 'self'.
# nginx does not inherit add_header into a location that sets its own add_header.
# Repeat this line in that location if the SPA document is served from there.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'" always;
