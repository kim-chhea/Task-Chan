; Task-Chan production PHP settings.
; How Laravel Cloud and Forge load this file is in DEPLOY.md.
; Attachments are capped at 10 MB in application code. 12M leaves room for
; the multipart body around that file. expose_php hides the X-Powered-By header.

expose_php = Off
upload_max_filesize = 12M
post_max_size = 12M
