name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: work_tracker_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4" }
      - run: cp .env.example .env && composer install --no-interaction --prefer-dist && php artisan key:generate
      - run: php artisan test
        env: { DB_HOST: 127.0.0.1, DB_PORT: 3306, DB_USERNAME: root, DB_PASSWORD: "" }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
